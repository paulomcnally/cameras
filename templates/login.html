<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cámaras</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #111; color: #eee; min-height: 100vh; }
        .login { display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login form { background: #222; padding: 2rem; border-radius: 8px; }
        .login input { display: block; width: 100%; margin: 0.5rem 0; padding: 0.75rem; border: 1px solid #444; border-radius: 4px; background: #333; color: #fff; }
        .login button { width: 100%; padding: 0.75rem; background: #2563eb; border: none; border-radius: 4px; color: #fff; cursor: pointer; font-size: 1rem; }
        .login button:hover { background: #1d4ed8; }
    </style>
</head>
<body>
    <div class="login">
        <form method="POST">
            <h2 style="margin-bottom: 1rem;">🎥 Cámaras</h2>
            <input type="text" name="user" placeholder="Usuario" required>
            <input type="password" name="pass" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
