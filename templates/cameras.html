<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Cámaras</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui; background: #111; color: #eee; }
        nav { background: #1a1a1a; padding: 0.75rem 1rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; }
        nav a { color: #93c5fd; text-decoration: none; margin-left: 1rem; }
        .content { max-width: 800px; margin: 1rem auto; padding: 0 1rem; }
        .card { background: #1a1a1a; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; border: 1px solid #333; }
        .card h3 { margin-bottom: 0.5rem; }
        table { width: 100%; border-collapse: collapse; margin-top: 0.5rem; }
        th, td { padding: 0.5rem; text-align: left; border-bottom: 1px solid #333; font-size: 0.9rem; }
        th { color: #888; }
        button { padding: 0.4rem 0.8rem; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .btn-del { background: #dc2626; color: #fff; }
        .btn-toggle { background: #333; color: #eee; }
        form { display: grid; gap: 0.5rem; }
        input { padding: 0.5rem; border: 1px solid #333; border-radius: 4px; background: #222; color: #fff; }
        .btn-add { background: #16a34a; color: #fff; padding: 0.5rem; margin-top: 0.5rem; }
    </style>
</head>
<body>
    <nav>
        <strong>🎥 Administrar</strong>
        <div>
            <a href="/">Inicio</a>
            <a href="/logout">Salir</a>
        </div>
    </nav>

    <div class="content">
        <div class="card">
            <h3>Agregar cámara</h3>
            <form id="addForm">
                <input type="text" name="name" placeholder="Nombre" required>
                <input type="text" name="ip" placeholder="IP (ej: 192.168.1.73)" required>
                <input type="number" name="port" placeholder="Puerto ONVIF (8899)" value="8899">
                <input type="text" name="user" placeholder="Usuario" required>
                <input type="password" name="password" placeholder="Contraseña" required>
                <input type="number" name="rtsp_port" placeholder="Puerto RTSP (554)" value="554">
                <button type="submit" class="btn-add">Agregar</button>
            </form>
        </div>

        <div class="card">
            <h3>Cámaras registradas</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>IP</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="camList">
                    {% for cam in cameras %}
                    <tr>
                        <td>{{ cam.name }}</td>
                        <td>{{ cam.ip }}</td>
                        <td>{{ '✅' if cam.enabled else '❌' }}</td>
                        <td>
                            <button class="btn-toggle" onclick="toggle({{ cam.id }})">
                                {{ 'Desactivar' if cam.enabled else 'Activar' }}
                            </button>
                            <button class="btn-del" onclick="del({{ cam.id }})">Eliminar</button>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>

    <script>
        document.getElementById('addForm').onsubmit = async (e) => {
            e.preventDefault();
            const fd = new FormData(e.target);
            const data = Object.fromEntries(fd);
            data.port = parseInt(data.port) || 8899;
            data.rtsp_port = parseInt(data.rtsp_port) || 554;
            await fetch('/api/cameras', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            location.reload();
        };

        async function del(id) {
            if (confirm('¿Eliminar cámara?')) {
                await fetch(`/api/cameras/${id}`, {method: 'DELETE'});
                location.reload();
            }
        }

        async function toggle(id) {
            await fetch(`/api/cameras/${id}/toggle`, {method: 'POST'});
            location.reload();
        }
    </script>
</body>
</html>
